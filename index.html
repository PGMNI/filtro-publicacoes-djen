<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
    <title>Filtro de publicações</title>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body>
    <main class="container" x-data="app">
        <article id="card">
            <hgroup>
                <h2>Filtro de Publicações</h2>
                <p>Filtra publicações do DJEN por nome da parte e palavras-chave</p>
            </hgroup>
            <hr>
            <!-- form -->
            <form role="search" @submit.prevent="submit()">
                <input name="nome_parte" type="search" placeholder="Nome da Parte" x-model="form.nome_parte" />
                <input type="submit" value="Pesquisar" />
            </form>

            <div>
                <label for="data_publicacao">Data da publicação</label>
                <input type="date" name="data_publicacao" x-model="form.data_publicacao" />
            </div>

            <div>
                <label for="keywords">Palavras-chave</label>
                <input type="text" :value="keywords.join(', ')" disabled/>
            </div>

            <!-- logs -->
             <div>
                <progress x-show="loading" />
             </div>

            <article class="log-box" id="box">
                <template x-for="log in logs">
                    ✓
                    <p x-text="log" class="col-12 mt-1 log"></p>
                    <hr>
                </template>
            </article>
        </article>
    </main>
</body>
</html>
