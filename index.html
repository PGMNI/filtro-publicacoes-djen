<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Filtro de publicações</title>
		<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.js"></script>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
	</head>
	<body>
		<div x-data="filtro">
			<form>
				<input type="text" x-model="form.nome_parte"/>
				<input type="date" x-model="form.data_publicacao" />
				<button type="submit"">Pesquisar</button>
			</form>
			<div>
				<span>texto</span>
			</div>
		</div>

		<script>
			document.addEventListener("alpine:init", () => {
				Alpine.data("filtro", () => ({
					form: {
                        nome_parte: "NOVA IGUACU",
                        data_publicacao: moment().format('YYYY-MM-DD'),
                    },

                    logs: ['Log 1', 'Log 2', 'Log 3'],

					salvar() {
						const doc = new docx.Document({
							sections: [
								{
									properties: {},
									children: [
										new docx.Paragraph({
											children: [
												new docx.TextRun("Hello World"),
												new docx.TextRun({
													text: "Foo Bar",
													bold: true,
												}),
												new docx.TextRun({
													text: "\tGithub is the best",
													bold: true,
												}),
											],
										}),
									],
								},
							],
						});

						docx.Packer.toBlob(doc).then((blob) => {
							saveAs(blob, "publicações.docx");
						});
					},
				}));
			});
		</script>
	</body>
</html>
