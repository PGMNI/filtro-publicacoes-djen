<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filtro de publicações</title>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body>
    <main class="container" x-data="app">
        <article>
            <!-- form -->
            <form role="search" @submit.prevent="submit()">
                <input name="nome_parte" type="search" placeholder="Nome da Parte" x-model="form.nome_parte" />
                <input type="submit" value="Pesquisar" />
            </form>


            <div class="col-12">
                <label for="data_publicacao" class="form-label">Data da publicação</label>
                <input class="form-control" type="date" name="data_publicacao" x-model="form.data_publicacao" />
            </div>

            <!-- logs -->
             <div>
                <progress x-show="loading" />

             </div>

            <article class="log-box" id="box">
                <template x-for="log in logs">
                    <p x-text="log" class="col-12 mt-1 log"></p>
                </template>
            </article>
        </article>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const box = document.getElementById("box");
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
