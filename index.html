<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Filtro de publicações</title>
		<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.js"></script>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>
	<body>
		<div x-data="filtro">
			<form @submit.prevent="submit()">
				<input type="text" x-model="form.nome_parte"/>
				<input type="date" x-model="form.data_publicacao" />
				<button type="submit"">Pesquisar</button>
			</form>
			<div>
				<template x-for="log in logs">
                    <li x-text="log"></li>
                </template>
			</div>
		</div>

		<script>
			document.addEventListener("alpine:init", () => {
				Alpine.data("filtro", () => ({
					form: {
                        nome_parte: "NOVA IGUACU",
                        data_publicacao: moment().format('YYYY-MM-DD'),
                    },
                    logs: [],
                    publicacoes: [],
                    publicacoes_filtradas: [],

                    async submit() {
                        await this.pesquisar();
                        this.filtrar();
                        this.salvar();
                    },

                    /** Pesquisar publicações */
                    async pesquisar() {
                        this.logs.push(`Pesquisando publicações para ${this.form.nome_parte} na data ${this.form.data_publicacao}...`);

                        const limite = 100;
                        let pagina = 1;
                        let items = [];

                        do {
                            let response = await axios.get('https://comunicaapi.pje.jus.br/api/v1/comunicacao', {
                                params: {
                                    nomeParte: this.form.nome_parte,
                                    dataDisponibilizacaoInicio: this.form.data_publicacao,
                                    dataDisponibilizacaoFim: this.form.data_publicacao,
                                    pagina: pagina
                                }
                            });

                            items = response.data.items;
                            this.publicacoes.push(...items);
                            ++pagina
                        } while (items.length === 0 || items.length === limite);
                        this.logs.push(`Encontradas ${this.publicacoes.length} publicações.`);
                    },

                    filtrar() {
                        this.logs.push(`Filtrando publicações...`);

                        const keywords = ['procuradoria', 'prefeitura', 'municipio'];

                        this.publicacoes_filtradas = this.publicacoes.filter(pub => {
                            return pub.destinatarios.some(dest => {

                                const nome = dest.nome.toLowerCase()
                                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                                    .replace('-', ' ');

                                const input = this.form.nome_parte.toLowerCase()
                                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                                    .replace('-', ' ');

                                if(!nome.includes(input)) {
                                    return false;
                                }

                                return keywords.some(keyword => nome.includes(keyword));
                            })
                        })

                        this.logs.push(`${this.publicacoes_filtradas.length} publicações filtradas...`);
                    },

					salvar() {
                        this.logs.push(`Salvando em arquivo docx...`);
						const doc = new docx.Document({
							sections: [
								{
									properties: {
                                        page: {
                                            pageNumbers: {
                                                start: 1,
                                                formatType: docx.NumberFormat.DECIMAL,
                                            },
                                        },
                                    },
                                    footers: {
                                        default: new docx.Footer({
                                            children: [new docx.Paragraph({
                                                alignment: docx.AlignmentType.RIGHT,
                                                children: [
                                                    new docx.TextRun({
                                                        children: ["Page Number: ", docx.PageNumber.CURRENT],
                                                    }),
                                                    new docx.TextRun({
                                                        children: [" de ", docx.PageNumber.TOTAL_PAGES],
                                                    }),
                                                ],
                                            })],
                                        }),
                                    },
									children: this.publicacoes_filtradas.map(pub => {
                                        
                                        return new docx.Paragraph({
                                            children: [
                                                new docx.TextRun({ 
                                                    text: `Processo ${pub.numeroprocessocommascara}`, 
                                                    break: 1
                                                }),
                                                new docx.TextRun({
                                                    text: 'Orgão: ',
                                                    bold: true,
                                                    break: 1
                                                }),
                                                new docx.TextRun({
                                                    text: pub.nomeOrgao,
                                                }),
                                                new docx.TextRun({
                                                    text: 'Data de disponibilização: ',
                                                    bold: true,
                                                    break: 1
                                                }),
                                                new docx.TextRun({
                                                    text: moment(pub.data_disponibilizacao).format('DD/MM/YYYY'),
                                                }),
                                                new docx.TextRun({
                                                    text: 'Tipo de comunicação: ',
                                                    bold: true,
                                                    break: 1
                                                }),
                                                new docx.TextRun({
                                                    text: pub.tipoComunicacao,
                                                }),
                                                new docx.TextRun({
                                                    text: 'Meio: ',
                                                    bold: true,
                                                    break: 1
                                                }),
                                                new docx.TextRun({
                                                    text: pub.meiocompleto,
                                                }),

                                                ...pub.link
                                                ? [
                                                    new docx.TextRun({
                                                        text: 'Inteiro Teor: ',
                                                        bold: true,
                                                        break: 1
                                                    }),
                                                    new docx.ExternalHyperlink({
                                                        children: [
                                                            new docx.TextRun({
                                                                text: "Clique Aqui",
                                                                style: "Hyperlink",
                                                            }),
                                                        ],
                                                        link: pub.link,
                                                    }),
                                                ]
                                                : [],
                                        
                                                new docx.TextRun({
                                                    text: 'Parte(s): ',
                                                    bold: true,
                                                    break: 1
                                                }),
                                                ...pub.destinatarios.map(dest => {
                                                    return new docx.TextRun({
                                                        text: dest.nome.toUpperCase(),
                                                        break: 1
                                                    });
                                                }),

                                                ...pub.destinatarioadvogados.length
                                                ? [
                                                    new docx.TextRun({
                                                        text: 'Advogado(s): ',
                                                        bold: true,
                                                        break: 1
                                                    }),
                                                    ...pub.destinatarioadvogados.map(dest => {
                                                        return new docx.TextRun({
                                                            text: dest.advogado.nome.toUpperCase(),
                                                            break: 1
                                                        });
                                                    })
                                                ]
                                                : [],

                                                new docx.TextRun({
                                                    text: pub.texto,
                                                    break: 2
                                                }),
                                            ],
                                        })
                                    }),
								},
							],
						});

						docx.Packer.toBlob(doc).then((blob) => {
							saveAs(blob, "publicações.docx");
						});

                        this.logs.push(`Concluido!`);
					},
				}));
			});
		</script>
	</body>
</html>
